name: JBC v1.3 Statutory Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  jbc-gate:
    name: Enforce JBC v1.3, Blueprint LVS, Z3 Contracts, & Rust Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository with full Git graph
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Cargo check & property test suite
        run: cargo test --locked || cargo test

      - name: Enforce Jezz JBC v1.3, Blueprint LVS, and Z3 Contract Proof Gate
        uses: futileandstupid/jezz@v0.6.1
        with:
          mode: ${{ github.event_name == 'pull_request' && 'both' || 'full' }}
          language: "rust"
          blueprint-target: "blueprint.json"
          prove: "require-deductive"
